<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#220810">
        <animate attributeName="stop-color" values="#220810;#2e0b17;#220810" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#4a0e22">
        <animate attributeName="stop-color" values="#4a0e22;#5c1230;#4a0e22" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#6b1230">
        <animate attributeName="stop-color" values="#6b1230;#4a0e22;#6b1230" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- shimmer sweep across the name -->
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#f5e6df"/>
      <stop offset="0.5" stop-color="#ffd9c7"/>
      <stop offset="1" stop-color="#f5e6df"/>
      <animate attributeName="x1" values="-300;1000" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1300" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>

    <path id="spark" d="M0 -9 Q1 -1 9 0 Q1 1 0 9 Q-1 1 -9 0 Q-1 -1 0 -9Z"/>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- slow, soft color blooms -->
  <g filter="url(#soft)">
    <ellipse cx="170" cy="90" rx="150" ry="90" fill="#9d2c4a" opacity="0.55">
      <animate attributeName="cx" values="170;260;170" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;130;90" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="840" cy="220" rx="170" ry="90" fill="#c9788a" opacity="0.32">
      <animate attributeName="cx" values="840;740;840" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;170;220" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="520" cy="300" rx="200" ry="60" fill="#d9b99b" opacity="0.18">
      <animate attributeName="cy" values="300;250;300" dur="10s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <rect width="1000" height="300" fill="url(#vignette)"/>

  <!-- frame that draws itself -->
  <rect x="24" y="24" width="952" height="252" fill="none" stroke="#d9b99b" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="2408" stroke-dashoffset="2408">
    <animate attributeName="stroke-dashoffset" from="2408" to="0" dur="3s" fill="freeze"/>
  </rect>
  <rect x="34" y="34" width="932" height="232" fill="none" stroke="#d9b99b" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="2368" stroke-dashoffset="2368">
    <animate attributeName="stroke-dashoffset" from="2368" to="0" dur="3.6s" begin="0.4s" fill="freeze"/>
  </rect>

  <!-- twinkling sparkles -->
  <g fill="#f5e6df">
    <g transform="translate(120 70)"><use href="#spark"><animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></use></g>
    <g transform="translate(880 80)"><use href="#spark"><animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.4;1.2;0.4" dur="4.2s" begin="1s" repeatCount="indefinite"/></use></g>
    <g transform="translate(790 230)"><use href="#spark"><animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.3;0.9;0.3" dur="3.8s" begin="2s" repeatCount="indefinite"/></use></g>
    <g transform="translate(205 232)"><use href="#spark"><animate attributeName="opacity" values="0;1;0" dur="4.6s" begin="0.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.3;1;0.3" dur="4.6s" begin="0.5s" repeatCount="indefinite"/></use></g>
    <g transform="translate(930 150)"><use href="#spark"><animate attributeName="opacity" values="0;0.8;0" dur="5s" begin="1.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.3;0.7;0.3" dur="5s" begin="1.5s" repeatCount="indefinite"/></use></g>
    <g transform="translate(70 150)"><use href="#spark"><animate attributeName="opacity" values="0;0.8;0" dur="5.4s" begin="2.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.3;0.7;0.3" dur="5.4s" begin="2.5s" repeatCount="indefinite"/></use></g>
  </g>

  <!-- small top label -->
  <text x="500" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="9" fill="#d9b99b" opacity="0">
    HELLO, I'M
    <animate attributeName="opacity" values="0;0;0.85" keyTimes="0;0.5;1" dur="2.4s" fill="freeze"/>
  </text>

  <!-- name -->
  <text x="500" y="158" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="72" letter-spacing="1" fill="url(#name)" opacity="0">
    Namrata Jaiswal
    <animate attributeName="opacity" from="0" to="1" dur="1.6s" begin="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1.6s" begin="0.4s" fill="freeze"/>
  </text>

  <!-- divider that grows -->
  <line x1="500" y1="188" x2="500" y2="188" stroke="#d9b99b" stroke-width="1" stroke-opacity="0.8">
    <animate attributeName="x1" from="500" to="350" dur="1.4s" begin="1.4s" fill="freeze"/>
    <animate attributeName="x2" from="500" to="650" dur="1.4s" begin="1.4s" fill="freeze"/>
  </line>

  <!-- role -->
  <text x="500" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="7" fill="#e3b5b5" opacity="0">
    FULL-STACK DEVELOPER  ·  MOTION LOVER
    <animate attributeName="opacity" from="0" to="1" dur="1.6s" begin="2s" fill="freeze"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
