<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1b1464;#3a0ca3;#0f0c29" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#302b63">
        <animate attributeName="stop-color" values="#302b63;#7209b7;#4361ee;#302b63" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#24243e">
        <animate attributeName="stop-color" values="#24243e;#4cc9f0;#f72585;#24243e" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#4cc9f0">
        <animate attributeName="stop-color" values="#4cc9f0;#f72585;#4cc9f0" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="clip"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="280" fill="url(#bg)"/>

    <!-- floating glow orbs -->
    <g filter="url(#blur)" opacity="0.7">
      <circle cx="140" cy="80" r="60" fill="#f72585">
        <animate attributeName="cy" values="80;200;80" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="140;220;140" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="850" cy="200" r="70" fill="#4cc9f0">
        <animate attributeName="cy" values="200;60;200" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="850;760;850" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="250" r="50" fill="#7209b7">
        <animate attributeName="cy" values="250;40;250" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- small rising particles -->
    <g fill="#ffffff" opacity="0.8">
      <circle cx="80" cy="270" r="3"><animate attributeName="cy" values="280;-10" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="270" r="2"><animate attributeName="cy" values="280;-10" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="270" r="3"><animate attributeName="cy" values="280;-10" dur="7s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="270" r="2"><animate attributeName="cy" values="280;-10" dur="9s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="270" r="3"><animate attributeName="cy" values="280;-10" dur="6.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="920" cy="270" r="2"><animate attributeName="cy" values="280;-10" dur="8s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- rotating rings -->
    <g transform="translate(880 70)" fill="none" stroke="#ffffff" stroke-opacity="0.35">
      <circle r="34" stroke-dasharray="6 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/></circle>
      <circle r="20" stroke-dasharray="3 7"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(110 215)" fill="none" stroke="#ffffff" stroke-opacity="0.3">
      <rect x="-22" y="-22" width="44" height="44" rx="8" stroke-dasharray="5 8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></rect>
    </g>

    <!-- waves -->
    <path d="M0 240 Q 125 210 250 240 T 500 240 T 750 240 T 1000 240 T 1250 240 T 1500 240 T 1750 240 V280 H0Z" fill="#ffffff" fill-opacity="0.08">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M0 250 Q 125 225 250 250 T 500 250 T 750 250 T 1000 250 T 1250 250 T 1500 250 T 1750 250 V280 H0Z" fill="#ffffff" fill-opacity="0.12">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- text -->
    <text x="500" y="125" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="url(#txt)" opacity="0">
      Namrata Jaiswal
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 25" to="0 0" dur="1.2s" fill="freeze"/>
    </text>
    <text x="500" y="175" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#ffffff" opacity="0">
      SHOPIFY DEVELOPER · MOTION LOVER
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2s" fill="freeze"/>
    </text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
